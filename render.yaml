services:
  - type: web
    name: lumiere-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./lumiere.db
      - key: CORS_ORIGINS
        value: '["*"]'
      - key: REGION_POLICY
        value: conservative
